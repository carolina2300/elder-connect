services:

  postgres:
    image: postgres:16
    container_name: elder-postgres

    environment:
      POSTGRES_DB: elder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:latest
    container_name: eldercare-kafka
    ports:
      - "9092:9092"


volumes:
  postgres_data: