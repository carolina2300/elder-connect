services:

  postgres:
    image: postgres:16
    container_name: elder-postgres

    environment:
      POSTGRES_DB: elder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:latest
    container_name: eldercare-kafka
    ports:
      - "9092:9092"

  app:
    image: eldercare:latest
    container_name: eldercare-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elder
      DB_USERNAME: admin
      DB_PASSWORD: admin
      MAIL_PASSWORD:
      JWT_SECRET:
      AWS_ACCESS_KEY:
      AWS_SECRET_KEY:
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: